# Ядро приложений (crates/client): аудиодвижок, локальная база, синхронизация, загрузки, волна без сети.
#
# Свой workspace, как у apps/shell: движок тянет libopus (собирается cmake) и cpal (на Linux —
# ALSA), база — SQLite (собирается из исходников). В образе сервера и в CI сервера этого нет, а корневой
# workspace собирается там целиком (`cargo chef cook`, `cargo test --workspace`). Приложение подключает
# крейты путём.
[workspace]
resolver = "3"
members = ["audio", "core", "downloads", "store", "sync"]

# Тесты движка рендерят минуты звука — без оптимизаций зависимостей они идут в разы дольше
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
