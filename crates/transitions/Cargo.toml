[package]
name = "dalywave-transitions"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Переходы «Диджей»: фразы и точки сведения по анализу трека, выбор приёма, кривые автоматики, карта темпа"

# Чистый Rust без платформенных зависимостей: общий для сервера (фразы и точки сведения в
# GET /api/tracks/{id}/analysis) и аудиодвижка приложений (crates/client/audio подключает путём).
# Поля пакета заданы явно, а не из workspace: движок собирается в своём workspace crates/client.
[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
