name: Приложения

# Сборка DalyWave для Windows и macOS: вручную или по тегу v*. Секреты (Settings → Secrets):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — подпись обновлений
#     (содержимое ~/.tauri/dalywave-updater.key и пароль из связки ключей, см. apps/shell/README.md);
#   APPLE_CERTIFICATE (p12 в base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY —
#     подпись Developer ID для macOS. Без них macOS собирается с подписью ad-hoc,
#     а без ключа обновлений — без файлов автообновления.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            runner: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Зависимости интерфейса
        working-directory: apps/ui
        run: bun install --frozen-lockfile

      # Версия Rust — из rust-toolchain.toml в корне
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell -> target
          key: ${{ matrix.target }}

      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Сборка
        shell: bash
        working-directory: apps/shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Пустой секрет приходит пустой строкой, а Tauri принимает её за значение
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                   APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!v}" ] || unset "$v"
          done
          args=(--ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}")
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::Нет TAURI_SIGNING_PRIVATE_KEY — сборка без файлов автообновления"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::Нет сертификата Developer ID — подпись ad-hoc"
            export APPLE_SIGNING_IDENTITY=-
          fi
          cargo tauri build "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: DalyWave-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/shell/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/shell/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            apps/shell/target/${{ matrix.target }}/release/bundle/nsis/*.exe*

      - name: Черновик релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/shell/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/shell/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            apps/shell/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
