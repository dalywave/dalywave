name: Приложения

# Сборка DalyWave для Windows и macOS вместе с загрузчиком музыки (services/fetcher/SIDECAR.md):
# вручную или из `make release`. FFmpeg для Windows собирается накрест на Linux (ffmpeg-windows.sh),
# остальной загрузчик — на своей системе (build.sh, build-windows.ps1). Секреты (Settings → Secrets):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — подпись обновлений
#     (содержимое ~/.tauri/dalywave-updater.key и пароль из связки ключей, см. apps/shell/README.md);
#   APPLE_CERTIFICATE (p12 в base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY —
#     подпись Developer ID для macOS. Без них macOS собирается с подписью ad-hoc,
#     а без ключа обновлений — без файлов автообновления;
#   DALYWAVE_RELEASE_TOKEN — выпуск на сервер обновлений (тот же, что в ~/dalywave/.env сервера).
# Запуск с «Выпустить» выпускает собранное на сервер обновлений: архив — в R2
# по ссылке от сервера, затем регистрация выпуска (apps/shell/README.md, «Выпуск»). Установщик
# (.dmg, на Windows — тот же setup.exe) уходит вместе с ним: его скачивают с сайта. macOS
# выпускается отсюда, только если есть сертификат Developer ID, иначе — make release-mac на Mac.
# Тег v* этот процесс не запускает: тег ставит `make release` для образов (images.yml), а Windows
# запускает сам — с NOTES; иначе та же версия выпустилась бы второй раз без «Что нового». Запуск
# вручную на теге (gh workflow run «Приложения» --ref v0.2.0 -f publish=true) сверяет тег с версией
# и кладёт сборки в черновик релиза GitHub.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Выпустить на сервер обновлений
        type: boolean
        default: false
      notes:
        description: Что нового (видно в настройках приложения)
        type: string
        default: ''

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # FFmpeg и ffprobe для Windows: звук и клипы, LGPL, статически — тот же состав, что у macOS
  ffmpeg-windows:
    name: FFmpeg для Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-win
          key: ffmpeg-windows-${{ hashFiles('services/fetcher/sidecar/ffmpeg-windows.sh') }}

      - name: Сборка
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc mingw-w64 libz-mingw-w64-dev nasm make curl xz-utils
          bash services/fetcher/sidecar/ffmpeg-windows.sh ffmpeg-win

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          if-no-files-found: error
          path: ffmpeg-win

  build:
    name: ${{ matrix.name }}
    needs: ffmpeg-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            runner: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      # ── Загрузчик (sidecar): services/fetcher/dist/sidecar, его берут externalBin и resources ──
      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: services/fetcher/dist/build/downloads
          key: sidecar-downloads-${{ matrix.target }}-${{ hashFiles('services/fetcher/sidecar/*') }}

      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ffmpeg-windows
          path: ffmpeg-win

      - name: Загрузчик для Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./services/fetcher/sidecar/build-windows.ps1 -Ffmpeg ffmpeg-win

      - name: Загрузчик для macOS
        if: runner.os == 'macOS'
        run: bash services/fetcher/sidecar/build.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Зависимости интерфейса
        working-directory: apps/ui
        run: bun install --frozen-lockfile

      # Версия Rust — из rust-toolchain.toml в корне
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell -> target
          key: ${{ matrix.target }}

      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Сборка
        shell: bash
        working-directory: apps/shell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Пустой секрет приходит пустой строкой, а Tauri принимает её за значение
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                   APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!v}" ] || unset "$v"
          done
          args=(--ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}")
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::Нет TAURI_SIGNING_PRIVATE_KEY — сборка без файлов автообновления"
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::Нет сертификата Developer ID — подпись ad-hoc"
            export APPLE_SIGNING_IDENTITY=-
          fi
          cargo tauri build "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: DalyWave-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/shell/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/shell/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            apps/shell/target/${{ matrix.target }}/release/bundle/nsis/*.exe*

      - name: Выпуск на сервер обновлений
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: bash
        env:
          DALYWAVE_RELEASE_TOKEN: ${{ secrets.DALYWAVE_RELEASE_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            # Сборка ad-hoc не должна заменить у установленных подписанную Developer ID
            echo "::warning::macOS без сертификата Developer ID не выпускается — make release-mac на Mac"
            exit 0
          fi
          [ -n "$DALYWAVE_RELEASE_TOKEN" ] || { echo "::error::Нет секрета DALYWAVE_RELEASE_TOKEN"; exit 1; }
          version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' apps/shell/Cargo.toml | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF#refs/tags/v}" != "$version" ]; then
            echo "::error::Тег ${GITHUB_REF#refs/tags/} не совпадает с версией $version в apps/shell/Cargo.toml"
            exit 1
          fi
          bun apps/shell/scripts/release.ts --target "${{ matrix.target }}"

      - name: Черновик релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/shell/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/shell/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            apps/shell/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
