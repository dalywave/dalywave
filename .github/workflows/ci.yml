name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Сервер (Rust)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: dalywave
          POSTGRES_PASSWORD: dalywave
          POSTGRES_DB: dalywave
        ports: ["5400:5432"]
        options: >-
          --health-cmd "pg_isready -U dalywave"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dalywave:dalywave@localhost:5400/dalywave
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    name: Интерфейс (Nuxt)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run i18n-check
      - run: bun test
      - run: bun run typecheck
      - run: bun run build

  fetcher:
    name: Скачивание (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/fetcher
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
