name: Feature request
description: Suggest a new feature or a change to an existing one
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first: the idea may already be discussed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Screens, examples and references to other apps help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it that you considered.
