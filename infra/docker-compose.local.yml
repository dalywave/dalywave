# Локальная среда: Postgres с pgvector и S3 (SeaweedFS). `make up`
# Postgres: localhost:5400   S3: http://localhost:8401
name: dalywave
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: dalywave
      POSTGRES_PASSWORD: dalywave
      POSTGRES_DB: dalywave
    ports: ["127.0.0.1:5400:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalywave"]
      interval: 3s
      retries: 20

  # S3-совместимое хранилище. В проде — Cloudflare R2 с тем же кодом
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    ports: ["127.0.0.1:8401:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      retries: 30

volumes:
  pgdata:
  s3data:
