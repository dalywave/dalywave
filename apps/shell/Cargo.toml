[package]
name = "dalywave-shell"
version = "0.1.12"
description = "DalyWave — оболочка Tauri для macOS, Windows, iPhone и iPad"
authors = ["Zakhar Stupak"]
edition = "2024"
rust-version = "1.99"
publish = false

# Свой workspace: тяжёлые зависимости Tauri и WebView не попадают в сборку и тесты сервера,
# а CI сервера на Linux не требует библиотек GTK/WebKit.
[workspace]

[lib]
name = "dalywave_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Звук — свой движок на Rust (crates/client/audio): декодирование, без пауз, кроссфейд
dalywave-audio = { path = "../../crates/client/audio" }
# Умный офлайн: локальная база, синхронизация, загрузки на устройство, волна без сети (crates/client)
dalywave-core = { path = "../../crates/client/core" }
dalywave-downloads = { path = "../../crates/client/downloads" }
dalywave-protocol = { path = "../../crates/protocol" }
dalywave-store = { path = "../../crates/client/store" }
dalywave-sync = { path = "../../crates/client/sync" }
# Сеть вкуса: обучение на этом компьютере тем же кодом, что и на сервере (trainer.rs)
dalywave-taste = { path = "../../crates/taste" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v7", "serde"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-log = "2.10.2"
tauri-plugin-opener = "2.7.3"

base64 = "0.22"
crossbeam-channel = "0.5.17"
getrandom = "0.4"
keyring-core = "1.0.1"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "net", "io-util", "sync", "time", "fs"] }
url = "2"

# Только компьютеры: один экземпляр, место окна, автообновление, связка ключей через keyring,
# загрузчик музыки — sidecar dalywave-fetcher (services/fetcher/SIDECAR.md)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.2"
tauri-plugin-shell = "2.6.0"
# Статус в Discord: Rich Presence через локальный IPC (сокет на macOS, именованный канал на Windows)
discord-rich-presence = "1.1"
# «Поделиться»: ссылка в буфер обмена из Rust — без жеста пользователя, которого ждёт WebView
tauri-plugin-clipboard-manager = "2.5.0"
# «Экспорт»: системное окно «Сохранить как» для выгрузки медиатеки (export.rs; права для JS не нужны)
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
# TLS — системный (Security.framework, SChannel): доверие из ОС и никакой сборки C-криптографии
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
# Дата выпуска из ответа сервера — интерфейсу в RFC 3339 (тот же time, что у плагина)
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-window-state = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSGeometry",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSString",
] }

# iPhone и iPad: окно входа поверх приложения, токен в защищённой связке ключей iOS
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
block2 = "0.6"
objc2 = "0.6"
objc2-authentication-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "ASFoundation",
    "ASWebAuthenticationSession",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSObject"] }
# Тема (ios.rs): цвет фона, «как в системе» — динамический UIColor по UITraitCollection
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "UIColor",
    "UIDevice",
    "UIInterface",
    "UIResponder",
    "UITraitCollection",
    "UIView",
    "UIWindow",
] }

# «Распознать» (recognize.rs): ShazamKit слушает микрофон через AVAudioEngine; доступ к
# микрофону — AVCaptureDevice (одинаково на macOS и iOS)
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioIONode",
    "AVAudioNode",
    "AVAudioSession",
    "AVAudioSessionTypes",
    "AVAudioTime",
    "AVAudioTypes",
] }
objc2-shazam-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-avf-audio",
    "SHError",
    "SHMatch",
    "SHMatchedMediaItem",
    "SHMediaItem",
    "SHSession",
    "SHSignature",
] }

[target.'cfg(windows)'.dependencies]
# Всплывающие уведомления, пока приложение открыто (notify.rs); на macOS — UNUserNotificationCenter
tauri-plugin-notification = "2"
# «Сейчас играет» и медиаклавиши Windows (SMTC); на macOS и iOS — MediaPlayer из движка
souvlaki = "0.9.3"
window-vibrancy = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
