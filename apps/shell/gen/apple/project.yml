# Xcode-проект DalyWave для iPhone и iPad. Создан `cargo tauri ios init` и доработан руками:
#   - своя фаза «Build Rust Code» (scripts/build-ios.sh) — Run в Xcode работает без Tauri CLI;
#   - фреймворки аудиодвижка и входа — статическая библиотека Rust не передаёт их линковщику;
#   - фоновый звук, ссылки dalywave://, тема и строка состояния по выбору в интерфейсе, значок с темами;
#   - Siri: App Intents (Swift в Sources, фразы — ru.lproj) и расширение SiriKit dalywave-siri;
#   - push (APNs): право aps-environment, делегат уведомлений Sources/…/PushLink.swift.
# Пересобрать проект: `make ios` (или `xcodegen generate` здесь). `cargo tauri ios init` заново
# не запускать: он перезапишет файл и вернёт штатную фазу, которой нужен запущенный CLI.
name: dalywave-shell
options:
  bundleIdPrefix: rest.daly.wave
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: DalyWave
      PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave
      DEVELOPMENT_TEAM: Y5KR5JPCRG
      CODE_SIGN_STYLE: Automatic
      # Значок: Icon Composer (iOS 26+, «жидкое стекло») и каталог с тёмной и тонированной темами
      # для iOS 18–25 — оба называются DalyWave
      ASSETCATALOG_COMPILER_APPICON_NAME: DalyWave
      TARGETED_DEVICE_FAMILY: "1,2"
      MARKETING_VERSION: 0.1.17
      CURRENT_PROJECT_VERSION: 1
targets:
  dalywave-shell_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Виджеты: общий снимок и кнопки (App Intents) — тот же код, что в расширении dalywave-widgets
      - path: WidgetsShared
      - path: Assets.xcassets
      # Тот же документ Icon Composer, что у macOS (apps/shell/icons)
      - path: ../../icons/DalyWave.icon
        type: file
        buildPhase: resources
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: dalywave-shell_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: dalywave-shell_iOS/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Музыка играет в фоне и на заблокированном экране
        UIBackgroundModes: [audio]
        # Возврат входа: dalywave://auth (окно входа ловит его само, Safari — по этой схеме)
        CFBundleURLTypes:
          - CFBundleURLName: rest.daly.wave
            CFBundleURLSchemes: [dalywave]
        # Тему (светлая, тёмная, как в системе) задаёт оболочка: overrideUserInterfaceStyle окна
        # (src/ios.rs), а стиль строки состояния — контроллер окна по этой теме. Плиста только для
        # заставки: она тёмная (LaunchScreen.storyboard), строка состояния на ней — светлая
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        # Разработка: свой сервер на Mac в локальной сети (http)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # «Распознать» (ShazamKit): микрофон — только пока открыт экран распознавания
        NSMicrophoneUsageDescription: Чтобы узнать, какая песня играет рядом
        # Быстрое действие на значке: долгое нажатие → «Распознать» (src/recognize.rs)
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: rest.daly.wave.recognize
            UIApplicationShortcutItemTitle: Распознать
            UIApplicationShortcutItemIconSymbolName: shazam.logo
        # Siri (src/siri.rs, Sources/dalywave-shell/DalyWaveIntents.swift, SiriExtension): окно
        # разрешения SiriKit; как ещё Siri может услышать название по-русски
        NSSiriUsageDescription: Чтобы включать музыку голосом — и на HomePod
        INAlternativeAppNames:
          - INAlternativeAppName: Дейли Вейв
            INAlternativeAppNamePronunciationHint: дейли вейв
          - INAlternativeAppName: Дейливейв
            INAlternativeAppNamePronunciationHint: дейливейв
    entitlements:
      path: dalywave-shell_iOS/dalywave-shell_iOS.entitlements
      properties:
        # SiriKit (INPlayMediaIntent от HomePod): служба Siri у App ID rest.daly.wave (IOS.md)
        com.apple.developer.siri: true
        # Виджеты: снимок «что играет», недавнее и сочетания волны — в общем контейнере
        com.apple.security.application-groups: [group.rest.daly.wave]
        # Push (APNs): возможность Push Notifications у App ID rest.daly.wave (IOS.md). В проекте —
        # development; при экспорте для App Store/TestFlight Xcode берёт значение из профиля
        # дистрибуции — production
        aps-environment: development
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # App Intents (DalyWaveIntents.swift) — Swift рядом с main.mm
        SWIFT_VERSION: "5.0"
      groups: [app]
    dependencies:
      # «Поделиться → DalyWave» — расширение встраивается в приложение (PlugIns)
      - target: dalywave-share
      # Siri: запросы музыки SiriKit (HomePod) — расширение в PlugIns
      - target: dalywave-siri
      # Виджеты WidgetKit — расширение в PlugIns
      - target: dalywave-widgets
      # Apple Watch: приложение часов ставится вместе с iPhone (Watch в бандле)
      - target: dalywave-watch
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # Статическая библиотека Rust не передаёт свои #[link(framework)] линковщику Xcode:
      # фреймворки аудиодвижка (cpal, MediaPlayer), окна входа, выбора AirPlay и прокси системы — здесь
      - sdk: AVFAudio.framework
      - sdk: AVKit.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: MediaPlayer.framework
      - sdk: AuthenticationServices.framework
      - sdk: SystemConfiguration.framework
      # «Распознать»: ShazamKit, микрофон через AVAudioEngine, доступ — AVCaptureDevice
      - sdk: ShazamKit.framework
      - sdk: AVFoundation.framework
      # Буферизованный вывод AirPlay 2 (AVSampleBufferAudioRenderer): CMSampleBuffer
      - sdk: CoreMedia.framework
      # Siri: INPlayMediaIntent в приложении (src/siri.rs), INPreferences, INMediaUserContext
      - sdk: Intents.framework
      # Push: разрешение, токен APNs, нажатие на уведомление (src/push.rs, PushLink.swift)
      - sdk: UserNotifications.framework
      # «Почувствуй бит»: удары Taptic Engine на сильных долях (src/beat.rs, DalyWaveBeat.swift)
      - sdk: CoreHaptics.framework
    preBuildScripts:
      # Своя фаза вместо `cargo tauri ios xcode-script`: работает из Xcode без запущенного CLI
      - script: |
          "${SRCROOT}/../../scripts/build-ios.sh"
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # «Поделиться → DalyWave»: пункт в меню «Поделиться» iOS для ссылок и текста. Своего окна нет —
  # открывает приложение ссылкой dalywave://share?url=… (ShareExtension/ShareViewController.swift)
  dalywave-share:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_NAME: DalyWaveShare
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.share
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        APPLICATION_EXTENSION_API_ONLY: YES
  # Siri, запросы музыки (INPlayMediaIntent): «Включи … в DalyWave» на iPhone и на HomePod. Без
  # сети и токена — превращает запрос в команду и отвечает .handleInApp (SiriExtension/IntentHandler.swift)
  dalywave-siri:
    type: app-extension
    platform: iOS
    sources:
      - path: SiriExtension
    info:
      path: SiriExtension/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            IntentsSupported: [INPlayMediaIntent]
            IntentsRestrictedWhileLocked: []
            SupportedMediaCategories: [INMediaCategoryMusic]
    dependencies:
      - sdk: Intents.framework
    settings:
      base:
        PRODUCT_NAME: DalyWaveSiri
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.siri
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        APPLICATION_EXTENSION_API_ONLY: YES
  # Виджеты (WidgetKit): «Сейчас играет», «Моя волна», «Недавнее», значки экрана блокировки и StandBy.
  # Данные — снимок приложения в App Group group.rest.daly.wave (src/widgets.rs → Swift), в сеть не
  # ходят; кнопки (iOS 17+) — App Intents, их выполняет приложение (Widgets/, WidgetsShared/)
  dalywave-widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: WidgetsShared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/dalywave-widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.rest.daly.wave]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: DalyWaveWidgets
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.widgets
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        APPLICATION_EXTENSION_API_ONLY: YES
  # Снимки виджетов в PNG (ImageRenderer): каждый размер, тёмная и светлая тема, тонированные значки.
  # `xcodebuild test -scheme dalywave-widgets` → design/shots/widgets
  dalywave-widgets_Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WidgetTests
      - path: Widgets
        excludes: [DalyWaveWidgets.swift, Info.plist, "*.entitlements"]
      - path: WidgetsShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.widgets.tests
        # ImageRenderer — iOS 16+, значки экрана блокировки без проверок версии
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
  # Проверки на симуляторе: окно входа и снимки экрана (make ios-test)
  dalywave-shell_UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: dalywave-shell_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: dalywave-shell_iOS
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.uitests
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        ARCHS: [arm64]
# Run в Xcode собирает release: отладочная сборка Rust на телефоне медленная для тяжёлых
# форматов (FLAC 24/96 с ресемплингом)
  # ---------- Apple Watch ----------
  # Пульт «Где играть» на SwiftUI (WatchApp): «Сейчас играет», «Моя волна», медиатека. Звук играет на
  # iPhone или компьютере. Своего входа нет: ключ — дочерняя сессия от iPhone через WatchConnectivity
  # (Sources/dalywave-shell/WatchLink.swift, src/watch.rs), хранится в связке ключей часов
  dalywave-watch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
      - path: WatchShared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: rest.daly.wave
        # Осложнения открывают приложение ссылками dalywave-watch://wave и dalywave-watch://now
        CFBundleURLTypes:
          - CFBundleURLName: rest.daly.wave.watch
            CFBundleURLSchemes: [dalywave-watch]
        # Разработка: свой сервер на Mac (http)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: WatchApp/DalyWaveWatch.entitlements
      properties:
        # Снимок «Сейчас играет» для осложнений (WatchShared/Snapshot.swift)
        com.apple.security.application-groups: [group.rest.daly.wave]
    dependencies:
      - target: dalywave-watch-widgets
    settings:
      base:
        PRODUCT_NAME: DalyWaveWatch
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.watchkitapp
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  # Осложнения и Smart Stack часов (WidgetKit): «Моя волна» и мини «Сейчас играет»
  dalywave-watch-widgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchWidgets
      - path: WatchShared
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/DalyWaveWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.rest.daly.wave]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: DalyWaveWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.watchkitapp.widgets
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  # ---------- /Apple Watch ----------
  # ---------- Apple TV ----------
  # Приложение для Apple TV на SwiftUI (TVApp): само играет звук (AVQueuePlayer, копии AAC с сервера —
  # `/stream?aac=true`), устройство «Где играть» (вид tv), «Моя волна», медиатека, поиск и вечеринка
  # с QR для гостей. Вход без клавиатуры: код на экране + подтверждение на телефоне или сайте
  # (`/api/auth/tv/*`). Та же запись App Store Connect, что у iPhone: bundle id rest.daly.wave, платформа
  # tvOS (универсальная покупка), версия — общая MARKETING_VERSION (IOS.md, раздел «Apple TV»)
  dalywave-tv:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: TVApp
      - path: TVShared
    info:
      path: TVApp/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        # Музыка играет и при заставке, и когда открыто другое приложение
        UIBackgroundModes: [audio]
        # Ссылки Top Shelf: dalywave-tv://wave, dalywave-tv://play?type=…&id=…
        CFBundleURLTypes:
          - CFBundleURLName: rest.daly.wave
            CFBundleURLSchemes: [dalywave-tv]
        # Разработка: свой сервер на Mac (http)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: TVApp/DalyWaveTV.entitlements
      properties:
        # Снимок для Top Shelf (TVShared/TopShelfSnapshot.swift)
        com.apple.security.application-groups: [group.rest.daly.wave]
    dependencies:
      - target: dalywave-tv-topshelf
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: TVServices.framework
    settings:
      base:
        PRODUCT_NAME: DalyWaveTV
        # Тот же bundle id, что у iPhone: tvOS — вторая платформа записи DalyWave
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
  # Top Shelf: верхняя полка Apple TV — «Моя волна» по настроениям, недавнее и плейлисты из снимка
  # приложения (в сеть не ходит)
  dalywave-tv-topshelf:
    type: app-extension
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: TVTopShelf
        excludes: ["Images"]
      - path: TVTopShelf/Images
        type: folder
        buildPhase: resources
      - path: TVShared
    info:
      path: TVTopShelf/Info.plist
      properties:
        CFBundleDisplayName: DalyWave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: TVTopShelf/DalyWaveTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.rest.daly.wave]
    dependencies:
      - sdk: TVServices.framework
    settings:
      base:
        PRODUCT_NAME: DalyWaveTopShelf
        # Расширение — с префиксом id приложения (rest.daly.wave.*), как share, siri и widgets у iPhone
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.topshelf
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: 0.1.17
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
  # ---------- /Apple TV ----------
schemes:
  dalywave-shell_iOS:
    build:
      targets:
        dalywave-shell_iOS: all
        dalywave-shell_UITests: [test]
    run:
      config: release
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    test:
      config: release
      targets:
        - dalywave-shell_UITests
    profile:
      config: release
    analyze:
      config: debug
    archive:
      config: release
  # Виджеты отдельно: снимки в PNG (тест без приложения) и запуск виджета из Xcode
  dalywave-widgets:
    build:
      targets:
        dalywave-widgets: all
        dalywave-widgets_Tests: [test]
    test:
      config: debug
      targets:
        - dalywave-widgets_Tests
  # Apple Watch отдельно: сборка и запуск на симуляторе часов
  dalywave-watch:
    build:
      targets:
        dalywave-watch: all
    run:
      config: debug
    archive:
      config: release
  # ---------- Apple TV ----------
