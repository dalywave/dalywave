[project]
name = "dalywave-fetcher"
version = "0.2.0"
description = "DalyWave: поиск записи трека Deezer на YouTube Music, скачивание без перекодирования и проверка отпечатком"
readme = "README.md"
authors = [
    { name = "Zakhar Stupak", email = "92329662+Dalynkaa@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.2,<3",
    "fastapi>=0.162",
    "httpx>=0.28.1",
    "numpy>=2.3",
    "pydantic>=2.14",
    "rapidfuzz>=3.14",
    "uvicorn>=0.54",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
fetcher = "dalywave_fetcher.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["bench/out"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: ходит в сеть (Deezer, YouTube); запуск: pytest -m network"]
addopts = "-m 'not network'"
# Starlette 1.x советует httpx2 для TestClient; на сами тесты не влияет.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
