<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DalyWave · направления дизайна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0f; --panel: #141418; --line: #24242b; --text: #f2f2f5; --muted: #9a9aa6; --accent: #c9b8ff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Onest, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  header { padding: 40px 32px 8px; max-width: 1480px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); max-width: 720px; }
  nav { position: sticky; top: 0; z-index: 2; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  nav .in { max-width: 1480px; margin: 0 auto; padding: 12px 32px; display: flex; gap: 8px; flex-wrap: wrap; }
  nav a { color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 500; }
  nav a:hover { color: var(--text); border-color: #3a3a44; }
  main { max-width: 1480px; margin: 0 auto; padding: 8px 32px 80px; }
  section { padding-top: 40px; }
  .head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h2 { font-size: 22px; margin: 0; }
  .open { color: var(--accent); text-decoration: none; font-weight: 500; }
  .chosen { font-size: 12px; font-weight: 600; color: #0c0c0f; background: linear-gradient(135deg, #4B21FF, #B01CF0 40%, #FF3D7A 74%, #FF9A3C); padding: 3px 10px; border-radius: 999px; color: #fff; }
  .concept { color: var(--muted); margin: 0 0 18px; max-width: 900px; }
  .row { display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-bottom: 24px; align-items: start; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 10px 14px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; }
  figcaption a { color: var(--muted); }
  .missing { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  @media (max-width: 860px) {
    header, nav .in, main { padding-left: 16px; padding-right: 16px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Три направления дизайна DalyWave</h1>
  <p>Одни и те же экраны — главная с волной и плеер — в трёх характерах. Скриншоты сделаны на ширине iPhone и MacBook; живые прототипы открываются по ссылке, волна в них анимирована и реагирует на музыку.</p>
</header>
<nav><div class="in" id="nav"></div></nav>
<main id="main"></main>
<script>
  const directions = [
    { id: 'a', name: 'А · «Полночь»', chosen: true, concept: 'Премиально и спокойно: глубокий тёмный фон, окрашенный обложкой, стекло, сдержанная типографика. Энергия — только в волне и в том, что играет. Выбрано в основу: палитра настроений совпадает с градиентом иконки «Сумерки», а волна буквально волна, как знак «Волна‑W».' },
    { id: 'b', name: 'Б · «Импульс»', concept: 'Баланс: спокойная премиальная основа и один электрический акцент, характерный шрифт для больших моментов, точные геометрические компоненты.' },
    { id: 'c', name: 'В · «Сцена»', concept: 'Энергия через типографику и свет: крупные заголовки, обложки на строгой сетке, сценический свет — дозированно. Рабочие элементы остаются тихими.' },
  ];
  const screens = [
    { route: 'home', title: 'Главная с волной' },
    { route: 'player', title: 'Плеер' },
    { route: 'components', title: 'Компоненты' },
  ];
  const nav = document.getElementById('nav');
  const main = document.getElementById('main');
  for (const d of directions) {
    nav.insertAdjacentHTML('beforeend', `<a href="#dir-${d.id}">${d.name}</a>`);
    const rows = screens.map(s => `
      <div class="row">
        ${shot(d.id, s, 'phone')}
        ${shot(d.id, s, 'desktop')}
      </div>`).join('');
    main.insertAdjacentHTML('beforeend', `
      <section id="dir-${d.id}">
        <div class="head"><h2>${d.name}</h2>${d.chosen ? '<span class="chosen">выбрано</span>' : ''}<a class="open" href="directions/${d.id}/#home">Открыть прототип →</a></div>
        <p class="concept">${d.concept}</p>
        ${rows}
      </section>`);
  }
  // Итоги года: три варианта историй
  nav.insertAdjacentHTML('beforeend', '<a href="#rewind">Итоги года</a>');
  main.insertAdjacentHTML('beforeend', `
    <section id="rewind">
      <div class="head"><h2>Итоги года · три варианта</h2><a class="open" href="rewind/">Открыть живые истории →</a></div>
      <p class="concept">А «Волна года» — живая волна перетекает между слайдами и становится графиком минут. Б «Разворот» — журнальный постер: плоский цвет обложки, огромные цифры, шторки. В «Пластинка» — конверт, кассета, полароиды, пластинка под иглой, значок и чек итогов. Все скриншоты — в shots/rewind-options/.</p>
      <div class="row" style="grid-template-columns: repeat(3, 1fr)">
        ${['a', 'b', 'c'].map(v => `<figure><img src="shots/rewind-options/${v}-3-track-phone.png" alt="Трек года, вариант ${v}" loading="lazy"><figcaption><span>Трек года · ${{ a: 'А', b: 'Б', c: 'В' }[v]}</span><a href="rewind/story.html?v=${v}">вживую</a></figcaption></figure>`).join('')}
      </div>
      <figure><img src="shots/rewind-options/overview-desktop.png" alt="Три варианта рядом" loading="lazy"><figcaption><span>Все варианты и рамка на компьютере</span><a href="rewind/">вживую</a></figcaption></figure>
    </section>`);
  function shot(dir, s, size) {
    const src = `shots/${dir}/${s.route}-${size}.png`;
    const label = `${s.title} · ${size === 'phone' ? 'телефон' : 'десктоп'}`;
    return `<figure>
      <img src="${src}" alt="${label}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'скриншот ещё не готов'}))">
      <figcaption><span>${label}</span><a href="directions/${dir}/#${s.route}">вживую</a></figcaption>
    </figure>`;
  }
</script>
</body>
</html>
