name: dw-spike
options:
  bundleIdPrefix: rest.daly.wave.spike
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: DalyWave Spike
      PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.spike
      DEVELOPMENT_TEAM: Y5KR5JPCRG
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
# Запуск из Xcode (⌘R) собирает release: отладочная сборка Rust на телефоне слишком медленная
# для тяжёлых форматов (FLAC 24/96 с ресемплингом).
schemes:
  dw-spike_iOS:
    build:
      targets:
        dw-spike_iOS: all
        dw-spike_UITests: [test]
    run:
      config: release
      environmentVariables:
        RUST_BACKTRACE: full
    test:
      config: debug
      targets:
        - dw-spike_UITests
    profile:
      config: release
    analyze:
      config: debug
    archive:
      config: release
targets:
  dw-spike_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: dw-spike_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: dw-spike_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Фоновое воспроизведение и доступ к тестовому серверу в локальной сети.
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Тестовая версия загружает звук с компьютера в вашей сети.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: dw-spike_iOS/dw-spike_iOS.entitlements
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # Статическая библиотека Rust не передаёт свои #[link(framework)] линковщику Xcode:
      # фреймворки аудиодвижка (cpal, objc2) перечисляем здесь.
      - sdk: AVFAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: MediaPlayer.framework
    preBuildScripts:
      # Своя фаза вместо `cargo tauri ios xcode-script`: работает из Xcode без запущенного CLI.
      - script: |
          "${SRCROOT}/../../build-ios.sh"
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # UI-тест экрана блокировки (только для проверки на симуляторе).
  dw-spike_UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: dw-spike_iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: dw-spike_iOS
        PRODUCT_BUNDLE_IDENTIFIER: rest.daly.wave.spike.uitests
        DEVELOPMENT_TEAM: Y5KR5JPCRG
        ARCHS: [arm64]
