[package]
name = "dw-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "DalyWave audio spike: Tauri 2 shell for dw-audio on macOS and iOS"

[lib]
name = "dw_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dw-audio = { path = "../../engine" }
# Страница статическая: всегда вшиваем её в бинарник (иначе отладочная сборка из Xcode ищет dev-сервер).
tauri = { version = "2.12", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
log = "0.4"
crossbeam-channel = "0.5.17"
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = "0.6"
