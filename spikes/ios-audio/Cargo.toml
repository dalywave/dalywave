[workspace]
resolver = "3"
members = ["engine", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Диск на машине сборки почти заполнен: без отладочной информации зависимостей и без
# инкрементального кэша отладочная сборка в разы меньше.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"
