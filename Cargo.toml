[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
dalywave-protocol = { path = "crates/protocol" }

anyhow = "1"
axum = "0.8.9"
axum-extra = { version = "0.12", features = ["cookie-private", "cookie-key-expansion"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15"
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
ipnet = "2"
p256 = { version = "0.14", features = ["ecdsa"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "ipnet",
    "migrate",
    "macros",
] }
subtle = "2.6"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "compression-br",
    "compression-gzip",
    "fs",
    "limit",
    "request-id",
    "set-header",
    "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
utoipa = { version = "6", features = ["uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
