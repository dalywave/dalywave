[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "crates/taste", "crates/textmatch", "crates/transitions"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.19"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
dalywave-protocol = { path = "crates/protocol" }
dalywave-taste = { path = "crates/taste" }
dalywave-textmatch = { path = "crates/textmatch" }
dalywave-transitions = { path = "crates/transitions" }

aes-gcm = "0.10"
anyhow = "1"
# Пароли своих аккаунтов: argon2id (соль даёт сам сервер)
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie-private", "cookie-key-expansion"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15"
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ipnet = "2"
# Теги своей музыки: ID3, Vorbis comments, MP4, APE, RIFF INFO; встроенные обложки и длительность
lofty = "0.25"
# Наблюдение за папками своей музыки
# Объявление сервера в локальной сети (`_dalywave._tcp`): Apple TV и приложения находят его сами
mdns-sd = "0.21"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
# Сеть вкуса на сервере: onnxruntime статически (готовые сборки pyke, в том числе linux aarch64),
# загрузка при сборке — по rustls, без OpenSSL в образе сборки
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }
p256 = { version = "0.14", features = ["ecdsa", "ecdh"] }
# http2 — APNs принимает только HTTP/2
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
# Подписи id_token провайдеров OIDC: RS256/PS256, ES256/ES384, EdDSA (уже есть в сборке через rustls)
ring = "0.17"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "ipnet",
    "migrate",
    "macros",
] }
subtle = "2.6"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
    "compression-br",
    "compression-gzip",
    "cors",
    "fs",
    "limit",
    "request-id",
    "set-header",
    "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1"
url = "2"
utoipa = { version = "6", features = ["uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
